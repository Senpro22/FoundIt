name: AI Service CI - Test & Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ai-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-service/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build check
        run: |
          python -c "from app.main import app; print('Build OK: app imported successfully')"
