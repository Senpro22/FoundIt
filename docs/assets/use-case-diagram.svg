<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1110" viewBox="0 0 1520 1110" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .uc { fill:#eef4fb; stroke:#2d5f8b; stroke-width:2 }
    .uct { font-size:15px; fill:#12324d; text-anchor:middle }
    .assoc { stroke:#3b3b3b; stroke-width:1.6; fill:none }
    .rel { stroke:#7a7a7a; stroke-width:1.5; stroke-dasharray:7 5; fill:none; marker-end:url(#arrow) }
    .rlbl { font-size:12.5px; fill:#6b6b6b; font-style:italic; text-anchor:middle }
    .actor { stroke:#12324d; stroke-width:2; fill:none }
    .an { font-size:15px; font-weight:600; fill:#12324d; text-anchor:middle }
    .as { font-size:12px; fill:#5a6b78; text-anchor:middle }
    .bnd { fill:none; stroke:#9aa7b1; stroke-width:2 }
    .bndt { font-size:19px; font-weight:700; fill:#44586a; text-anchor:middle }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
